services:
  database:
    image: ${HARNIQO_IDENTITY_POSTGRES_IMAGE:?Set an immutable PostgreSQL 17 image reference}
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - identity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        export KC_DB_PASSWORD="$$(cat /run/secrets/db_password)"
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: ${HARNIQO_IDENTITY_PUBLIC_ORIGIN:?Set the full HTTPS origin}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    secrets:
      - db_password
    volumes:
      - type: bind
        source: ${HARNIQO_IDENTITY_REALM_FILE:?Set the absolute runtime realm file path}
        target: /opt/keycloak/data/import/harniqo-realm.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r protocol status remainder <&3
          [[ "$$status" = 200 ]]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  proxy:
    image: ${HARNIQO_IDENTITY_PROXY_IMAGE:?Set an immutable Nginx image reference}
    environment:
      HARNIQO_IDENTITY_PUBLIC_HOST: ${HARNIQO_IDENTITY_PUBLIC_HOST:?Set the public HTTPS hostname or IPv4 address}
      HARNIQO_IDENTITY_PUBLIC_PORT: ${HARNIQO_IDENTITY_PUBLIC_PORT:?Set the public HTTPS port}
      NGINX_ENVSUBST_FILTER: ^HARNIQO_IDENTITY_PUBLIC_
    ports:
      - "127.0.0.1:${HARNIQO_IDENTITY_LOCAL_PORT:-10055}:8443"
    volumes:
      - ./oidc.conf.template:/etc/nginx/templates/default.conf.template:ro
      - type: bind
        source: ${HARNIQO_IDENTITY_TLS_CERT_FILE:?Set the absolute TLS chain file path}
        target: /etc/nginx/server.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HARNIQO_IDENTITY_TLS_KEY_FILE:?Set the absolute TLS key file path}
        target: /etc/nginx/server.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

secrets:
  db_password:
    file: ${HARNIQO_IDENTITY_DB_PASSWORD_FILE:?Set the absolute password file path}

volumes:
  identity-data:

networks:
  frontend:
  backend:
    internal: true
